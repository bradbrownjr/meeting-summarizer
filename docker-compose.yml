services:
  meeting-summarizer:
    build: .
    image: ghcr.io/bradbrownjr/meeting-summarizer:latest
    container_name: meeting-summarizer
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - meeting-hf-cache:/root/.cache/huggingface
      - meeting-data:/data
      - ./templates-yaml:/templates
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - WHISPER_URL=http://host.docker.internal:9000
      - OLLAMA_URL=http://host.docker.internal:11434
      - UPLOAD_DIR=/data/jobs
      - DATA_DIR=/data
      - TEMPLATES_DIR=/templates
      - WEB_PORT=8082

volumes:
  meeting-hf-cache:
  meeting-data:
